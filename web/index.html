<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ede8df" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Add to Home Screen: opens straight to our shared lists (docs/operations.md). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kanban" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preload" href="/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin />
    <title>Kanban</title>
    <script>
      // Re-apply the last theme before anything paints (written by src/lib/theme.ts).
      try {
        const t = JSON.parse(localStorage.getItem('kanban.theme'));
        if (t) {
          for (const [k, v] of Object.entries(t.attrs)) document.documentElement.dataset[k] = v;
          for (const [k, v] of Object.entries(t.vars)) document.documentElement.style.setProperty(k, v);
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
